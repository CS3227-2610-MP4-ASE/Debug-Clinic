name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: debugclinic_test
          POSTGRES_USER: debugclinic
          POSTGRES_PASSWORD: debugclinic
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U debugclinic -d debugclinic_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      APP_ORIGIN: http://127.0.0.1:4173
      CORS_ORIGINS: http://127.0.0.1:4173
      DATABASE_URL: postgresql://debugclinic:debugclinic@127.0.0.1:5432/debugclinic_test
      DATABASE_URL_POOLED: postgresql://debugclinic:debugclinic@127.0.0.1:5432/debugclinic_test
      TEST_DATABASE_URL: postgresql://debugclinic:debugclinic@127.0.0.1:5432/debugclinic_test
      BETTER_AUTH_URL: http://127.0.0.1:4173
      BETTER_AUTH_SECRET: ci-only-secret-with-at-least-32-characters
      AI_PROVIDER: fake
      LOG_LEVEL: silent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Verify workflow accounting and monitoring
        run: python3 -B -m unittest discover -s tests/workflow -v
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run db:validate
      - run: npm run db:deploy
      - run: npm run db:seed
      - run: npm test
      - run: npm run test:integration
      - run: npm audit --audit-level=moderate
      - run: npm run build

  browser:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
