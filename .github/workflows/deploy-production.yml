name: Deploy production

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
      DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
      DATABASE_URL_POOLED: ${{ secrets.PRODUCTION_DATABASE_URL_POOLED }}
      BETTER_AUTH_SECRET: ${{ secrets.PRODUCTION_BETTER_AUTH_SECRET }}
      GOOGLE_CLIENT_ID: ${{ secrets.PRODUCTION_GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.PRODUCTION_GOOGLE_CLIENT_SECRET }}
      SOC_LLM_ENDPOINT: ${{ secrets.SOC_LLM_ENDPOINT }}
      SOC_LLM_MODEL: ${{ vars.SOC_LLM_MODEL }}
      SOC_LLM_API_KEY: ${{ secrets.SOC_LLM_API_KEY }}
      APP_ORIGIN: ${{ vars.PRODUCTION_APP_ORIGIN }}
      CORS_ORIGINS: ${{ vars.PRODUCTION_APP_ORIGIN }}
      BETTER_AUTH_URL: ${{ vars.PRODUCTION_APP_ORIGIN }}
      AI_PROVIDER: soc
      NODE_ENV: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Apply database migrations
        run: npm run db:deploy
      - name: Deploy immutable production build
        run: npx --yes netlify-cli@27.16.1 deploy --prod --dir=apps/frontend/dist --functions=netlify/functions --message="${{ github.sha }}"
