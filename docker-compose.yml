services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: debugclinic
      POSTGRES_USER: debugclinic
      POSTGRES_PASSWORD: debugclinic
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U debugclinic -d debugclinic"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - debugclinic-postgres:/var/lib/postgresql/data

  postgres-test:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: debugclinic_test
      POSTGRES_USER: debugclinic
      POSTGRES_PASSWORD: debugclinic
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U debugclinic -d debugclinic_test"]
      interval: 5s
      timeout: 5s
      retries: 10
    tmpfs:
      - /var/lib/postgresql/data

volumes:
  debugclinic-postgres:
